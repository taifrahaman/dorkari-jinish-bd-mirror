name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository == 'Creative-Engineering-Bangladesh/dorkari-jinish-bd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  type-check:
    if: github.repository == 'Creative-Engineering-Bangladesh/dorkari-jinish-bd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  build:
    if: github.repository == 'Creative-Engineering-Bangladesh/dorkari-jinish-bd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Write .env.local for build
        run: echo "${{ secrets.ENV_TEST_FILE }}" > .env.local
      - run: pnpm build

  deploy:
    if: |
      github.repository == 'Creative-Engineering-Bangladesh/dorkari-jinish-bd' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: [lint, type-check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      
      - run: pnpm install --frozen-lockfile
      
      - name: Create .env.production for Build
        run: echo "${{ secrets.ENV_FILE }}" > .env.production
        
      - name: Build project for production
        run: pnpm build
        
      - name: Prepare standalone folder
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          # CHANGED: Copying the .cjs file instead of .js
          cp ecosystem.config.cjs .next/standalone/
          cp .env.production .next/standalone/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to VPS
        run: |
          tar -czf - -C .next/standalone . | ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p /var/www/dorkari-jinish-bd && tar -xzf - -C /var/www/dorkari-jinish-bd"

      - name: Deploy and restart on VPS
        run: |
          # CHANGED: Pointing PM2 to the .cjs file
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "cd /var/www/dorkari-jinish-bd && pm2 reload ecosystem.config.cjs --env production || pm2 start ecosystem.config.cjs --env production && pm2 save"

  mirror:
    if: |
      github.repository == 'Creative-Engineering-Bangladesh/dorkari-jinish-bd' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Personal Repo
        run: |
          git remote add mirror https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/taifrahaman/dorkari-jinish-bd-mirror.git
          git push mirror HEAD:main --force