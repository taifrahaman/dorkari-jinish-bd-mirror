name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository == 'Creative-Engineering-Bangladesh/dorkari-jinish-bd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  type-check:
    if: github.repository == 'Creative-Engineering-Bangladesh/dorkari-jinish-bd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  build:
    if: github.repository == 'Creative-Engineering-Bangladesh/dorkari-jinish-bd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Write .env.local for build
        run: echo "${{ secrets.ENV_TEST_FILE }}" > .env.local
      - run: pnpm build

  # ==========================================
  # DEPLOY JOB (NATIVE SSH)
  # ==========================================
  deploy:
    if: |
      github.repository == 'Creative-Engineering-Bangladesh/dorkari-jinish-bd' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: [lint, type-check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      
      - run: pnpm install --frozen-lockfile
      
      - name: Create .env.production for Build
        run: echo "${{ secrets.ENV_FILE }}" > .env.production
        
      - name: Build project for production
        run: pnpm build
        
      - name: Prepare standalone folder
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cp ecosystem.config.js .next/standalone/
          cp .env.production .next/standalone/ # Copy env file into the deployment folder

      # NEW NATIVE SSH SETUP
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          # Print the secret, remove any Windows \r characters, and save to a file
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Add the VPS to known_hosts so it doesn't prompt for confirmation
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to VPS
        run: |
          # Use tar over SSH (much faster and more reliable than SCP for folders)
          tar -czf - -C .next/standalone . | ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p /var/www/dorkari-jinish-bd && tar -xzf - -C /var/www/dorkari-jinish-bd"

      - name: Deploy and restart on VPS
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "cd /var/www/dorkari-jinish-bd && pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production && pm2 save"

  # ==========================================
  # MIRROR JOB
  # ==========================================
  mirror:
    if: |
      github.repository == 'Creative-Engineering-Bangladesh/dorkari-jinish-bd' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Personal Repo
        run: |
          git remote add mirror https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/taifrahaman/dorkari-jinish-bd-mirror.git
          git push mirror HEAD:main --force